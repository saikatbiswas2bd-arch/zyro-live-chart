<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Order Flow – Binance Spot</title>
<style>
:root{--bg:#10141a;--card:#171d26;--tx:#e8edf3;--mu:#8793a3;--up:#34b27b;--dn:#ef5b5b;--ac:#6aa7ff;--wr:#e0a82e;--ln:#2a3340;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f8;--card:#fff;--tx:#18202b;--mu:#5b6676;--up:#12805a;--dn:#c93a3a;--ac:#1a62d6;--wr:#9a6700;--ln:#d5dbe3;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Noto Sans Bengali",sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:18px;margin:6px 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--wr)}.dot.on{background:var(--up)}
#st{color:var(--mu);font-weight:400;font-size:13px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
button,select{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
button.on{border-color:var(--ac);color:var(--ac)}
button:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px;margin-bottom:10px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:7px 10px}
.c small{color:var(--mu);display:block;font-size:12px}.c b{font-size:16px;font-weight:600}
canvas{width:100%;height:480px;background:var(--card);border:1px solid var(--ln);border-radius:8px;touch-action:pan-y;display:block}
.meter{display:grid;gap:8px;margin-bottom:10px}
.m span{font-size:13px;display:block;margin-bottom:3px}
.m i{display:block;height:10px;border-radius:5px;background:var(--dn);overflow:hidden}
.m u{display:block;height:100%;background:var(--up);text-decoration:none}
.note{color:var(--mu);font-size:12px;margin:10px 0 0;max-width:80ch}
.up{color:var(--up)}.dn{color:var(--dn)}.wr{color:var(--wr)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Order Flow <span class="dot" id="dot"></span><span id="st">সংযোগ হচ্ছে…</span></h1>
  <div class="bar"><select id="sym" aria-label="Symbol"><option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option><option>BNBUSDT</option></select><span id="tfs"></span></div>
  <div class="meter" id="meter"></div>
  <div class="cards" id="cards"></div>
  <canvas id="cv" role="img" aria-label="Live price, delta and cumulative delta chart"></canvas>
  <p class="note">চার্টে চাপ দিয়ে বা টেনে যেকোনো candle বেছে নিন। Buy = taker buy volume, Sell = বাকি volume, Delta = Buy − Sell, Pressure = Buy ÷ Total। ডেটা Binance spot থেকে সরাসরি আপনার ব্রাউজারে আসে, পুরো বাজারের ছবি নয়। এটি তথ্য, বিনিয়োগ পরামর্শ নয়; ট্রেডে ক্ষতি হতে পারে।</p>
</div>
<script>
const $=id=>document.getElementById(id);
const TFS=["1m","5m","15m","1h","4h"];
const REST=["https://data-api.binance.vision","https://api.binance.com"];
const WS=["wss://data-stream.binance.vision","wss://stream.binance.com:9443"];
let sym="BTCUSDT",tf="5m",C=[],sel=-1,ws=null,gen=0,q=0;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const f=x=>Math.abs(x)>=1000?(x/1000).toFixed(2)+"k":x.toFixed(2);
const ts=t=>new Date(t).toISOString().slice(5,16).replace("T"," ");
const redraw=()=>{if(!q){q=1;requestAnimationFrame(()=>{q=0;draw()})}};
const setSt=(on,t)=>{$("dot").className="dot"+(on?" on":"");$("st").textContent=t};
const row=r=>({t:r[0],o:+r[1],h:+r[2],l:+r[3],c:+r[4],v:+r[5],b:+r[9]});

$("tfs").innerHTML=TFS.map(t=>`<button data-t="${t}">${t}</button>`).join(" ");
$("tfs").onclick=e=>{if(e.target.dataset.t){tf=e.target.dataset.t;start()}};
$("sym").onchange=e=>{sym=e.target.value;start()};

async function start(){
  const g=++gen;
  if(ws){ws.onclose=null;ws.close()}
  document.querySelectorAll("#tfs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tf));
  setSt(false,"ডেটা আনা হচ্ছে…");C=[];sel=-1;
  let err="";
  for(const h of REST){
    const nm=h.replace("https://","");
    try{const r=await fetch(`${h}/api/v3/klines?symbol=${sym}&interval=${tf}&limit=120`);
      if(r.ok){C=(await r.json()).map(row);break}err+=` [${nm}: HTTP ${r.status}]`}catch(e){err+=` [${nm}: ${e.message}]`}
  }
  if(g!==gen)return;
  if(!C.length){setSt(false,"ডেটা আনা যায়নি."+err);draw();return}
  draw();connect(g,0);
}
function connect(g,i){
  if(g!==gen)return;
  let ok=false;
  ws=new WebSocket(`${WS[i%WS.length]}/ws/${sym.toLowerCase()}@kline_${tf}`);
  ws.onopen=()=>{ok=true;setSt(true,"live")};
  ws.onmessage=m=>{
    const k=JSON.parse(m.data).k;if(!k)return;
    const x={t:k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c,v:+k.v,b:+k.V},L=C[C.length-1];
    if(L&&L.t===x.t)C[C.length-1]=x;else{C.push(x);if(C.length>120)C.shift()}
    redraw();
  };
  ws.onclose=()=>{if(g!==gen)return;setSt(false,"আবার সংযোগ হচ্ছে…");setTimeout(()=>connect(g,ok?i:i+1),2500)};
}
function cards(){
  const i=sel>=0?sel:C.length-1,c=C[i];
  if(!c){$("cards").innerHTML="";return}
  const buy=c.b,sell=c.v-c.b,d=buy-sell,p=c.v?buy/c.v:.5,bull=c.c>=c.o,warn=(bull&&d<0)||(!bull&&d>0);
  const it=(k,v,cl="")=>`<div class="c"><small>${k}</small><b class="${cl}">${v}</b></div>`;
  $("cards").innerHTML=it("Candle (UTC)",ts(c.t)+(i===C.length-1?" • চলমান":""))
    +it("Buy",f(buy),"up")+it("Sell",f(sell),"dn")
    +it("Delta",(d>0?"+":"")+f(d),d>=0?"up":"dn")+it("Total",f(c.v))
    +it("Pressure",p.toFixed(3),p>.55?"up":p<.45?"dn":"")
    +it("Candle",bull?"Bull":"Bear",bull?"up":"dn")
    +it("Delta বিপরীত?",warn?"হ্যাঁ":"না",warn?"wr":"");
}
function meter(){
  const n=C.length;if(!n){$("meter").innerHTML="";return}
  const i=sel>=0?sel:n-1,one=C[i],last=C.slice(-12);
  const bar=(t,bv,v)=>{const p=v?bv/v:.5,s=p>.55?"Buyers এগিয়ে":p<.45?"Sellers এগিয়ে":"প্রায় সমান";
    return `<div class="m"><span>${t}: <b class="${p>.55?"up":p<.45?"dn":""}">${s}</b> · Buy ${(p*100).toFixed(0)}% / Sell ${(100-p*100).toFixed(0)}%</span><i><u style="width:${p*100}%"></u></i></div>`};
  $("meter").innerHTML=bar(i===n-1?"চলমান candle":"নির্বাচিত candle",one.b,one.v)
    +bar("শেষ ১২ candle",last.reduce((s,c)=>s+c.b,0),last.reduce((s,c)=>s+c.v,0));
}
function draw(){
  cards();meter();
  const cv=$("cv"),dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  const x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const n=C.length;if(!n)return;
  const up=css("--up"),dn=css("--dn"),mu=css("--mu"),ln=css("--ln"),ac=css("--ac"),wr=css("--wr");
  const pl=8,pr=56,w=(W-pl-pr)/n,cx=i=>pl+(i+.5)*w;
  const P=[[22,H*.52],[H*.52+22,H*.78],[H*.78+22,H-8]];
  x.font="11px system-ui,sans-serif";
  const lab=(t,y,top)=>{x.fillStyle=mu;x.textAlign="left";x.fillText(t,pl+2,top)};
  const ax=(v,y)=>{x.fillStyle=mu;x.textAlign="right";x.fillText(v,W-4,y+4)};
  const D=C.map(c=>2*c.b-c.v);let cum=0;const CU=D.map(d=>cum+=d);
  if(sel>=0){x.fillStyle=ln;x.globalAlpha=.5;x.fillRect(pl+sel*w,8,w,H-16);x.globalAlpha=1}
  // price
  let [a,b]=P[0],hi=Math.max(...C.map(c=>c.h)),lo=Math.min(...C.map(c=>c.l));
  const py=v=>a+(hi-v)/((hi-lo)||1)*(b-a);
  lab("Price",0,14);ax(hi.toFixed(2),a);ax(lo.toFixed(2),b);
  C.forEach((c,i)=>{const col=c.c>=c.o?up:dn;x.strokeStyle=x.fillStyle=col;
    x.beginPath();x.moveTo(cx(i),py(c.h));x.lineTo(cx(i),py(c.l));x.stroke();
    const y1=py(Math.max(c.o,c.c)),y2=py(Math.min(c.o,c.c));x.fillRect(cx(i)-w*.35,y1,w*.7,Math.max(1,y2-y1))});
  // delta
  [a,b]=P[1];const m=Math.max(...D.map(Math.abs))||1,mid=(a+b)/2;
  lab("Delta",0,a-8);ax("+"+f(m),a);ax("−"+f(m),b);
  x.strokeStyle=ln;x.beginPath();x.moveTo(pl,mid);x.lineTo(W-pr,mid);x.stroke();
  D.forEach((d,i)=>{const c=C[i],h=d/m*(b-a)/2;x.fillStyle=d>=0?up:dn;
    x.fillRect(cx(i)-w*.35,h>=0?mid-h:mid,w*.7,Math.max(1,Math.abs(h)));
    if((c.c>=c.o&&d<0)||(c.c<c.o&&d>0)){x.fillStyle=wr;x.beginPath();x.arc(cx(i),a+3,2,0,7);x.fill()}});
  // cumulative delta
  [a,b]=P[2];const mx=Math.max(...CU,0),mn=Math.min(...CU,0),cy=v=>a+(mx-v)/((mx-mn)||1)*(b-a);
  lab("Cumulative delta (এই ১২০ candle)",0,a-8);ax(f(CU[n-1]),cy(CU[n-1]));
  x.strokeStyle=ln;x.beginPath();x.moveTo(pl,cy(0));x.lineTo(W-pr,cy(0));x.stroke();
  x.strokeStyle=ac;x.lineWidth=1.6;x.beginPath();CU.forEach((v,i)=>i?x.lineTo(cx(i),cy(v)):x.moveTo(cx(i),cy(v)));x.stroke();x.lineWidth=1;
}
const pick=e=>{const n=C.length,w=($("cv").clientWidth-64)/n,i=Math.floor((e.offsetX-8)/w);sel=i>=n-1||i<0?-1:i;redraw()};
$("cv").onpointermove=pick;$("cv").onpointerdown=pick;$("cv").onpointerleave=()=>{sel=-1;redraw()};
addEventListener("resize",redraw);
start();
</script>
</body>
</html>
